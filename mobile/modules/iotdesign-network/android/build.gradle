plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.iotdesignnetwork'
version = '1.0.0'

android {
  namespace "expo.modules.iotdesignnetwork"
  defaultConfig {
    versionCode 1
    versionName '1.0.0'
  }
}

dependencies {
  implementation "androidx.camera:camera-view:1.6.0"
  implementation "com.google.ar:core:1.57.0"
}
